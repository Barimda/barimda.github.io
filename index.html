                         height="640"
                         onerror="console.error('❌ Card 1 failed:', this.src)">
                </div>
                
                <!-- Card 2 -->
                <div class="card-slide" data-card="2" role="group" aria-roledescription="slide" aria-label="Карта 2 из 4" aria-hidden="true">

                         height="640"
                         onerror="console.error('❌ Card 2 failed:', this.src)">
                </div>
                
                <!-- Card 3 -->

            <!-- Envelope Container -->

                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                            <span class="visually-hidden">Сохранить как картинку</span>
                        </button>
                        <button class="share-btn" id="share-btn" type="button" title="Поделиться ссылкой" aria-label="Поделиться этим отказом">

                                <circle cx="6" cy="12" r="3"/>
                                <circle cx="18" cy="19" r="3"/>
                                <path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/>
                            </svg>
                            <span class="visually-hidden">Поделиться</span>

                <button class="tab-btn" data-tab="custom" role="tab" aria-selected="false" aria-controls="custom-tab" id="custom-tab-btn" tabindex="-1">Своё послание</button>

            <!-- Preset Tab -->

            </div>
            
            <!-- Custom Tab -->
            <div class="tab-content" id="custom-tab" role="tabpanel" aria-labelledby="custom-tab-btn" hidden>
                <form id="message-form" novalidate>
                    <div class="form-group">
                        <label for="custom-text">Текст отказа:</label>
                        <textarea id="custom-text" 
                                  name="text"
                                  rows="4" 
                                  placeholder="Милостивый государь, позвольте заметить..." 
                                  maxlength="500"
                                  required
                                  aria-describedby="char-count"></textarea>
                        <span class="char-count" id="char-count" aria-live="polite"><span>0</span>/500</span>
                    </div>
                    
                    <div class="form-group">
                        <label for="custom-signature">Подпись:</label>
                        <input type="text" 
                               id="custom-signature" 
                               name="signature"
                               placeholder="С уважением..." 
                               maxlength="100"
                               required>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn-secondary" id="reset-defaults">Сбросить</button>
                        <button type="submit" class="btn-primary">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="script.js"></script>
